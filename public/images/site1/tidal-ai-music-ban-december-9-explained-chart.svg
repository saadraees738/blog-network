<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, DejaVu Sans, sans-serif">
<rect width="1200" height="630" fill="#0e1422"/>
<text x="60" y="62" font-size="34" fill="#fff" font-weight="700" text-anchor="start">Tidal and fully AI-generated music: the dated steps</text>
<text x="60" y="100" font-size="20" fill="#aab6cc" font-weight="400" text-anchor="start">Blue = Tidal's own pages. Amber = reported by news sites, not confirmed on Tidal pages read.</text>
<line x1="60" y1="335" x2="1140" y2="335" stroke="#55627c" stroke-width="4"/>
<circle cx="150" cy="335" r="13" fill="#4cc9f0"/>
<line x1="150" y1="322" x2="150" y2="285" stroke="#4cc9f0" stroke-width="3"/>
<text x="150" y="175" font-size="23" fill="#4cc9f0" font-weight="700" text-anchor="middle">29 June 2026</text>
<text x="150" y="211" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">Policy effective:</text>
<text x="150" y="239" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">labels and no</text>
<text x="150" y="267" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">royalties set out</text>
<circle cx="330" cy="335" r="13" fill="#4cc9f0"/>
<line x1="330" y1="348" x2="330" y2="385" stroke="#4cc9f0" stroke-width="3"/>
<text x="330" y="412" font-size="23" fill="#4cc9f0" font-weight="700" text-anchor="middle">Mid-July</text>
<text x="330" y="448" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">AI tag due</text>
<text x="330" y="476" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">to appear</text>
<circle cx="510" cy="335" r="13" fill="#4cc9f0"/>
<line x1="510" y1="322" x2="510" y2="285" stroke="#4cc9f0" stroke-width="3"/>
<text x="510" y="203" font-size="23" fill="#4cc9f0" font-weight="700" text-anchor="middle">19 October</text>
<text x="510" y="239" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">Policy page</text>
<text x="510" y="267" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">last updated</text>
<circle cx="690" cy="335" r="13" fill="#fbbf24"/>
<line x1="690" y1="348" x2="690" y2="385" stroke="#fbbf24" stroke-width="3"/>
<text x="690" y="412" font-size="23" fill="#fbbf24" font-weight="700" text-anchor="middle">24 November</text>
<text x="690" y="448" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">Removal plan</text>
<text x="690" y="476" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">announced</text>
<circle cx="870" cy="335" r="13" fill="#fbbf24"/>
<line x1="870" y1="322" x2="870" y2="285" stroke="#fbbf24" stroke-width="3"/>
<text x="870" y="203" font-size="23" fill="#fbbf24" font-weight="700" text-anchor="middle">9 December</text>
<text x="870" y="239" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">Removals due</text>
<text x="870" y="267" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">to begin</text>
<circle cx="1050" cy="335" r="13" fill="#fbbf24"/>
<line x1="1050" y1="348" x2="1050" y2="385" stroke="#fbbf24" stroke-width="3"/>
<text x="1050" y="412" font-size="23" fill="#fbbf24" font-weight="700" text-anchor="middle">Finish date</text>
<text x="1050" y="448" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">end of 2026 or</text>
<text x="1050" y="476" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">start of 2027</text>
<text x="1050" y="504" font-size="20" fill="#e8edf7" font-weight="400" text-anchor="middle">(wording differs)</text>
<text x="60" y="600" font-size="18" fill="#aab6cc" font-weight="400" text-anchor="start">Sources: Tidal policy, help and magazine pages; TechCrunch; Hypebot. Checked 26 November 2026. Not to scale.</text>
</svg>