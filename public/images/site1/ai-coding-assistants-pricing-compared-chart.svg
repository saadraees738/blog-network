<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
  <title id="t">Monthly price range of individual AI coding plans</title>
  <desc id="d">Range chart from cheapest paid plan to top individual plan per month: Cursor 8 to 200 dollars, GitHub Copilot 10 to 100 dollars, Claude with Claude Code 20 to 200 dollars.</desc>
  <rect width="800" height="420" fill="#f8fafc"/>
  <text x="40" y="46" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Monthly price, entry plan to top plan</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="14" fill="#475569">Individual plans, US list prices, November 2026. Bar spans entry to top.</text>
  <line x1="200" y1="96" x2="200" y2="330" stroke="#e2e8f0"/>
  <text x="200" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">$0</text>
  <line x1="335" y1="96" x2="335" y2="330" stroke="#e2e8f0"/>
  <text x="335" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">$50</text>
  <line x1="470" y1="96" x2="470" y2="330" stroke="#e2e8f0"/>
  <text x="470" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">$100</text>
  <line x1="605" y1="96" x2="605" y2="330" stroke="#e2e8f0"/>
  <text x="605" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">$150</text>
  
  <text x="40" y="145" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">GitHub Copilot</text>
  <rect x="227" y="125" width="243" height="30" rx="15" fill="#2563eb"/>
  <text x="485" y="146" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">$10 to $100</text>
  <text x="40" y="215" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Cursor</text>
  <rect x="222" y="195" width="518" height="30" rx="15" fill="#7c3aed"/>
  <text x="238" y="216" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">$8 to $200</text>
  <text x="40" y="285" font-family="Arial, sans-serif" font-size="16" fill="#0f172a">Claude (with Claude Code)</text>
  <rect x="254" y="265" width="486" height="30" rx="15" fill="#ea580c"/>
  <text x="270" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">$20 to $200</text>
  <text x="40" y="402" font-family="Arial, sans-serif" font-size="13" fill="#475569">Chart by Stackbrook from vendor pricing pages. Usage included at each price differs.</text>
  <line x1="740" y1="96" x2="740" y2="330" stroke="#e2e8f0"/>
  <text x="740" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">$200</text>
</svg>
