<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Grouped bar chart of OpenAI-reported Jalapeno ratios on three models: work per watt and lower end-to-end latency, as multiples of the comparison system">
<rect width="1200" height="630" fill="#f7f6f2"/>
