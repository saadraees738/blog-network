<text x="312.0" y="285" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="312.0" y="335" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Verify</text>
<text x="312.0" y="372" font-family="Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle">Phone, email,</text>
<text x="312.0" y="396" font-family="Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle">DNS TXT or</text>
<text x="312.0" y="420" font-family="Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle">Shopify</text>
<path d="M397 340 h18" stroke="#1d2a2a" stroke-width="3"/><path d="M408 333 l8 7 l-8 7" fill="none" stroke="#1d2a2a" stroke-width="3"/>
