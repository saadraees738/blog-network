<rect x="41" y="230" width="158" height="220" rx="12" fill="#1f7a7a"/>
<text x="120.0" y="285" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="120.0" y="335" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Business Hub</text>
<text x="120.0" y="372" font-family="Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle">Open it in the</text>
<text x="120.0" y="396" font-family="Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle">ChatGPT sidebar</text>
<path d="M205 340 h18" stroke="#1d2a2a" stroke-width="3"/><path d="M216 333 l8 7 l-8 7" fill="none" stroke="#1d2a2a" stroke-width="3"/>
