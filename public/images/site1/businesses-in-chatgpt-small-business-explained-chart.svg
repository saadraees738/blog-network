<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Flow diagram of the claim process for Businesses in ChatGPT: open Business Hub, verify, complete Persona identity check, update the profile, then optionally add a product feed and publish a business agent">
<rect width="1200" height="630" fill="#f7f6f2"/>
