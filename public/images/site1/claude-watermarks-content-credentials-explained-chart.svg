<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, Arial, sans-serif"><rect width="1200" height="630" fill="#ffffff"/><text x="60" y="70" font-size="36" font-weight="700" fill="#111827">AI content marking: key 2026 dates</text><text x="60" y="108" font-size="22" fill="#4b5563">EU AI Act Article 50 and Anthropic, as stated on the cited pages</text><line x1="250" y1="160" x2="250" y2="552" stroke="#9ca3af" stroke-width="4"/><circle cx="250" cy="188" r="13" fill="#6b7280"/><text x="215" y="197" font-size="26" font-weight="700" text-anchor="end" fill="#111827">10 June</text><text x="292" y="196" font-size="24" fill="#1f2937">European Commission publishes the voluntary Code of Practice</text><circle cx="250" cy="272" r="13" fill="#6b7280"/><text x="215" y="281" font-size="26" font-weight="700" text-anchor="end" fill="#111827">July</text><text x="292" y="280" font-size="24" fill="#1f2937">Anthropic signs the Code, according to the company</text><circle cx="250" cy="356" r="13" fill="#2563eb"/><text x="215" y="365" font-size="26" font-weight="700" text-anchor="end" fill="#111827">2 August</text><text x="292" y="364" font-size="24" fill="#1f2937">Article 50 transparency rules start to apply</text><circle cx="250" cy="440" r="13" fill="#6b7280"/><text x="215" y="449" font-size="26" font-weight="700" text-anchor="end" fill="#111827">14 August</text><text x="292" y="448" font-size="24" fill="#1f2937">Anthropic publishes its text watermark explainer</text><circle cx="250" cy="524" r="13" fill="#dc2626"/><text x="215" y="533" font-size="26" font-weight="700" text-anchor="end" fill="#111827">2 December</text><text x="292" y="532" font-size="24" fill="#1f2937">Marking duty starts for systems on the market before 2 August</text><text x="60" y="600" font-size="18" fill="#6b7280">Sources: European Commission, AI Act FAQ and news; Anthropic. Dots are not spaced to scale.</text></svg>