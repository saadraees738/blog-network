<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Bar chart of annual-billing prices per user per month for Otter, Fireflies and Fathom">
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#1d2a2a">Price per user per month, annual billing</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="20" fill="#4a5656">US dollars, list prices as of 12 Nov 2026. Fathom Business has a 2-user minimum.</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#1d2a2a">
    <text x="60" y="190" font-weight="700">Entry paid plan</text>
    <text x="60" y="245">Otter Pro</text>
    <text x="60" y="295">Fireflies Pro</text>
    <text x="60" y="345">Fathom Premium</text>
    <text x="60" y="405" font-weight="700">Business plan</text>
    <text x="60" y="460">Otter Business</text>
    <text x="60" y="510">Fireflies Business</text>
    <text x="60" y="560">Fathom Business</text>
  </g>
  <g>
    <rect x="300" y="222" width="250" height="32" fill="#2b6f8f"/>
    <rect x="300" y="272" width="300" height="32" fill="#c4572b"/>
    <rect x="300" y="322" width="480" height="32" fill="#6b5b95"/>
    <rect x="300" y="437" width="600" height="32" fill="#2b6f8f"/>
    <rect x="300" y="487" width="570" height="32" fill="#c4572b"/>
    <rect x="300" y="537" width="750" height="32" fill="#6b5b95"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">
    <text x="312" y="245">$8.33</text>
    <text x="312" y="295">$10</text>
    <text x="312" y="345">$16</text>
    <text x="312" y="460">$19.99</text>
    <text x="312" y="510">$19</text>
    <text x="312" y="560">$25</text>
  </g>
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="16" fill="#4a5656">Sources: Fathom pricing page, Fireflies help guide, Otter pricing page. Bars to scale.</text>
</svg>
