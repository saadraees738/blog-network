<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter,DejaVu Sans,Arial,sans-serif"><rect width="1200" height="630" fill="#0f172a"/>
<text x="60" y="70" font-size="32" font-weight="700" fill="#f8fafc">Log-perplexity: lower means better next-token prediction</text>
<text x="60" y="108" font-size="20" fill="#94a3b8">OpenAI figures on its internal codebase data (not comparable across labs)</text>
<rect x="933" y="250" width="56" height="140" fill="#a78bfa" opacity="0.35"/>
<text x="961" y="420" font-size="18" fill="#c4b5fd" text-anchor="middle">Expected window</text><text x="961" y="444" font-size="18" fill="#c4b5fd" text-anchor="middle">0.68 to 0.70</text><text x="961" y="468" font-size="16" fill="#94a3b8" text-anchor="middle">(author expectation)</text>
<line x1="656" y1="230" x2="656" y2="410" stroke="#facc15" stroke-width="3" stroke-dasharray="8 6"/>
<text x="656" y="190" font-size="18" fill="#facc15" text-anchor="middle">Below 0.8: "transformative</text><text x="656" y="212" font-size="18" fill="#facc15" text-anchor="middle">capabilities" begin to emerge</text>
<line x1="100" y1="320" x2="1100" y2="320" stroke="#64748b" stroke-width="3"/>
<line x1="100" y1="312" x2="100" y2="328" stroke="#64748b" stroke-width="2"/><text x="100" y="352" font-size="18" fill="#94a3b8" text-anchor="middle">1.00</text>
<line x1="239" y1="312" x2="239" y2="328" stroke="#64748b" stroke-width="2"/><text x="239" y="352" font-size="18" fill="#94a3b8" text-anchor="middle">0.95</text>
<line x1="378" y1="312" x2="378" y2="328" stroke="#64748b" stroke-width="2"/><text x="378" y="352" font-size="18" fill="#94a3b8" text-anchor="middle">0.90</text>
<line x1="517" y1="312" x2="517" y2="328" stroke="#64748b" stroke-width="2"/><text x="517" y="352" font-size="18" fill="#94a3b8" text-anchor="middle">0.85</text>
<line x1="656" y1="312" x2="656" y2="328" stroke="#64748b" stroke-width="2"/><text x="656" y="352" font-size="18" fill="#94a3b8" text-anchor="middle">0.80</text>
<line x1="794" y1="312" x2="794" y2="328" stroke="#64748b" stroke-width="2"/><text x="794" y="352" font-size="18" fill="#94a3b8" text-anchor="middle">0.75</text>
<line x1="933" y1="312" x2="933" y2="328" stroke="#64748b" stroke-width="2"/><text x="933" y="352" font-size="18" fill="#94a3b8" text-anchor="middle">0.70</text>
<line x1="1072" y1="312" x2="1072" y2="328" stroke="#64748b" stroke-width="2"/><text x="1072" y="352" font-size="18" fill="#94a3b8" text-anchor="middle">0.65</text>
<circle cx="128" cy="320" r="14" fill="#fb923c" stroke="#f8fafc" stroke-width="3"/><text x="128" y="285" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">GPT-3.5</text><text x="128" y="388" font-size="18" fill="#cbd5e1" text-anchor="middle">about 0.99</text>
<circle cx="350" cy="320" r="14" fill="#fb923c" stroke="#f8fafc" stroke-width="3"/><text x="350" y="285" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">GPT-4</text><text x="350" y="388" font-size="18" fill="#cbd5e1" text-anchor="middle">about 0.91</text>
<circle cx="767" cy="320" r="14" fill="#38bdf8" stroke="#f8fafc" stroke-width="3"/><text x="767" y="285" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Newer model</text><text x="767" y="388" font-size="18" fill="#cbd5e1" text-anchor="middle">about 0.76</text>
<text x="100" y="540" font-size="20" fill="#cbd5e1">Axis runs from 1.00 down to 0.65, so better models sit further right.</text>
<text x="100" y="575" font-size="16" fill="#64748b">Source: OpenAI, Perplexity and Intelligence, 22 November 2026. Chart by Stackbrook.</text></svg>