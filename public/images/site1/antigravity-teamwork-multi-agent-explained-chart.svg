<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Column chart: TCSBench score of 67.7 percent in the benchmark paper versus 71 percent reported by Google for Teamwork">
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1d2a2a">TCSBench: paper result vs Google's Teamwork score</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="20" fill="#4a5656">Percent, as stated in Google's Antigravity post of 27 August 2026 (vendor figures)</text>
  <line x1="120" y1="500" x2="1100" y2="500" stroke="#1d2a2a" stroke-width="2"/>
  <rect x="300" y="216" width="220" height="284" fill="#9aa8a8"/>
  <rect x="700" y="202" width="220" height="298" fill="#1f7a6d"/>
  <text x="410" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1d2a2a">67.7%</text>
  <text x="810" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1d2a2a">71%</text>
  <text x="410" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1d2a2a">TCSBench paper result</text>
  <text x="410" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4a5656">Gemini 3.6 Flash and 3.1 Pro</text>
  <text x="810" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1d2a2a">Reported with Teamwork</text>
  <text x="810" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4a5656">Gemini 3.7 Flash and 3.1 Pro</text>
  <text x="1140" y="610" text-anchor="end" font-family="Arial, sans-serif" font-size="15" fill="#4a5656">Bars start at zero. Chart created by Stackbrook.</text>
</svg>
