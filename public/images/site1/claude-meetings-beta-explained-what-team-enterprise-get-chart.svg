<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Flow diagram of the checks that decide whether Claude can join a call in the Claude Meetings beta">
<rect width="1200" height="630" fill="#f7f6f2"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1d2a2a">What decides whether Claude can join a call</text>
<text x="60" y="98" font-family="Arial, sans-serif" font-size="19" fill="#4a5656">From Anthropic's Claude Meetings announcement and release notes (12 Nov 2026); the order shown is illustrative</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a2a"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#1d2a2a">
<rect x="40" y="170" width="200" height="150" rx="10" fill="#1d2a2a"/>
<text x="140" y="205" font-size="20" font-weight="700" fill="#f7f6f2" text-anchor="middle">1. Plan</text>
<text x="140" y="240" font-size="18" fill="#f7f6f2" text-anchor="middle">Team or</text>
<text x="140" y="264" font-size="18" fill="#f7f6f2" text-anchor="middle">Enterprise</text>
<text x="140" y="296" font-size="15" fill="#cfd8d6" text-anchor="middle">other plans: not stated</text>
<rect x="260" y="170" width="200" height="150" rx="10" fill="#ffffff" stroke="#1d2a2a" stroke-width="2"/>
<text x="360" y="205" font-size="20" font-weight="700" text-anchor="middle">2. Organisation</text>
<text x="360" y="240" font-size="17" text-anchor="middle">Not available with</text>
<text x="360" y="264" font-size="17" text-anchor="middle">ZDR, HIPAA-ready</text>
<text x="360" y="288" font-size="17" text-anchor="middle">or CMEK setups</text>
<rect x="480" y="170" width="200" height="150" rx="10" fill="#ffffff" stroke="#1d2a2a" stroke-width="2"/>
<text x="580" y="205" font-size="20" font-weight="700" text-anchor="middle">3. Admin</text>
<text x="580" y="240" font-size="17" text-anchor="middle">Team: on by default</text>
<text x="580" y="264" font-size="17" text-anchor="middle">Enterprise: admin</text>
<text x="580" y="288" font-size="17" text-anchor="middle">turns it on</text>
<rect x="700" y="170" width="200" height="150" rx="10" fill="#ffffff" stroke="#1d2a2a" stroke-width="2"/>
<text x="800" y="205" font-size="20" font-weight="700" text-anchor="middle">4. Platform</text>
<text x="800" y="240" font-size="17" text-anchor="middle">Google Meet today</text>
<text x="800" y="264" font-size="17" text-anchor="middle">Others: coming soon</text>
<rect x="920" y="170" width="240" height="150" rx="10" fill="#e8b04a"/>
<text x="1040" y="205" font-size="20" font-weight="700" text-anchor="middle">5. Who is invited</text>
<text x="1040" y="240" font-size="17" text-anchor="middle">Outside guest present:</text>
<text x="1040" y="264" font-size="17" text-anchor="middle">Claude stays out unless</text>
<text x="1040" y="288" font-size="17" text-anchor="middle">an admin allows it</text>
<rect x="40" y="380" width="1120" height="190" rx="10" fill="#ffffff" stroke="#1d2a2a" stroke-width="2"/>
<text x="70" y="420" font-size="22" font-weight="700">What Anthropic says it saves per meeting</text>
<text x="70" y="460" font-size="19">Transcript, summary, descriptions of what was on screen, notes and action items</text>
<text x="70" y="494" font-size="19">Anything Claude built (docs, whiteboards), on the meeting's page in claude.ai</text>
<text x="70" y="528" font-size="19" font-weight="700">Not saved: audio</text>
<text x="70" y="556" font-size="15" fill="#4a5656">Notes and transcripts free in beta on Team and Enterprise; built artifacts free through 10 Feb 2027</text>
</g>
</svg>
