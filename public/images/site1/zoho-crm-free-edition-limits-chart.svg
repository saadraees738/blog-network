<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
  <title id="t">Zoho CRM paid editions, price per user per month</title>
  <desc id="d">Line chart of Zoho CRM list prices in US dollars per user per month, annual versus monthly billing: Standard 14 and 20, Professional 23 and 35, Enterprise 40 and 50, Ultimate 52 and 65. The Free edition is free for 3 users.</desc>
  <rect width="800" height="420" fill="#f8fafc"/>
  <text x="40" y="52" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Zoho CRM paid editions: price per user per month</text>
  <text x="40" y="78" font-family="Arial, sans-serif" font-size="14" fill="#475569">US dollar list prices from Zoho's published pricing pages. The Free edition covers 3 users.</text>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <line x1="90" y1="340" x2="740" y2="340" stroke="#e2e8f0"/>
    <text x="80" y="345" font-size="13" text-anchor="end" fill="#475569">$0</text>
    <line x1="90" y1="280" x2="740" y2="280" stroke="#e2e8f0"/>
    <text x="80" y="285" font-size="13" text-anchor="end" fill="#475569">$20</text>
    <line x1="90" y1="220" x2="740" y2="220" stroke="#e2e8f0"/>
    <text x="80" y="225" font-size="13" text-anchor="end" fill="#475569">$40</text>
    <line x1="90" y1="160" x2="740" y2="160" stroke="#e2e8f0"/>
    <text x="80" y="165" font-size="13" text-anchor="end" fill="#475569">$60</text>
    <polyline points="170,280 340,235 510,190 680,145" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="170" cy="280" r="7" fill="#2563eb"/>
    <circle cx="340" cy="235" r="7" fill="#2563eb"/>
    <circle cx="510" cy="190" r="7" fill="#2563eb"/>
    <circle cx="680" cy="145" r="7" fill="#2563eb"/>
    <polyline points="170,298 340,271 510,220 680,184" fill="none" stroke="#0d9488" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="170" cy="298" r="7" fill="#0d9488"/>
    <circle cx="340" cy="271" r="7" fill="#0d9488"/>
    <circle cx="510" cy="220" r="7" fill="#0d9488"/>
    <circle cx="680" cy="184" r="7" fill="#0d9488"/>
    <text x="170" y="266" font-size="15" font-weight="700" text-anchor="middle" fill="#1d4ed8">$20</text>
    <text x="340" y="221" font-size="15" font-weight="700" text-anchor="middle" fill="#1d4ed8">$35</text>
    <text x="510" y="176" font-size="15" font-weight="700" text-anchor="middle" fill="#1d4ed8">$50</text>
    <text x="680" y="131" font-size="15" font-weight="700" text-anchor="middle" fill="#1d4ed8">$65</text>
    <text x="170" y="324" font-size="15" font-weight="700" text-anchor="middle" fill="#0f766e">$14</text>
    <text x="340" y="297" font-size="15" font-weight="700" text-anchor="middle" fill="#0f766e">$23</text>
    <text x="510" y="246" font-size="15" font-weight="700" text-anchor="middle" fill="#0f766e">$40</text>
    <text x="680" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#0f766e">$52</text>
    <text x="170" y="368" font-size="15" text-anchor="middle">Standard</text>
    <text x="340" y="368" font-size="15" text-anchor="middle">Professional</text>
    <text x="510" y="368" font-size="15" text-anchor="middle">Enterprise</text>
    <text x="680" y="368" font-size="15" text-anchor="middle">Ultimate</text>
    <line x1="90" y1="340" x2="740" y2="340" stroke="#94a3b8" stroke-width="2"/>
    <rect x="520" y="104" width="14" height="14" rx="3" fill="#2563eb"/><text x="542" y="116" font-size="14">Billed monthly</text>
    <rect x="640" y="104" width="14" height="14" rx="3" fill="#0d9488"/><text x="662" y="116" font-size="14">Billed annually</text>
  </g>
  <text x="40" y="404" font-family="Arial, sans-serif" font-size="13" fill="#475569">Chart by Stackbrook. Prices change and the live page shows local currency; check before you buy.</text>
</svg>
