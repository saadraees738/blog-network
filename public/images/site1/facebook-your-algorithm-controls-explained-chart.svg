<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, DejaVu Sans, sans-serif">
<rect width="1200" height="630" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker></defs>
<text x="600" y="48" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">How Meta says a Your algorithm change is handled</text>
<rect x="60" y="90" width="300" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="210.0" y="124" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">You add a topic</text>
<text x="210.0" y="154" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Plain words, in one of</text>
<text x="210.0" y="180" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">two lists</text>
<rect x="450" y="90" width="300" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="600.0" y="124" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">Preference check</text>
<text x="600.0" y="154" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Coherent? Duplicate?</text>
<text x="600.0" y="180" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Safety component runs</text>
<rect x="840" y="90" width="300" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="990.0" y="124" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">One shared store</text>
<text x="990.0" y="154" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Read by both</text>
<text x="990.0" y="180" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Feed and Reels</text>
<line x1="362" y1="150" x2="446" y2="150" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<line x1="752" y1="150" x2="836" y2="150" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<path d="M990,212 L990,240 L315,240 L315,266" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<path d="M885,240 L885,266" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<rect x="60" y="272" width="510" height="250" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="315.0" y="306" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">Interested In</text>
<text x="315.0" y="336" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Four retrieval sources find posts</text>
<text x="315.0" y="362" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Relevance check on meaning</text>
<text x="315.0" y="388" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Passing posts get a late-ranking boost</text>
<text x="315.0" y="414" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">New topics get extra weight for a while</text>
<text x="315.0" y="440" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Repeats spaced; daily cap per topic</text>
<rect x="630" y="272" width="510" height="250" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
<text x="885.0" y="306" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">Not Interested In</text>
<text x="885.0" y="336" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Close matches removed in ranking</text>
<text x="885.0" y="362" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Near matches pushed down</text>
<text x="885.0" y="388" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Model rechecks list for new topics</text>
<text x="885.0" y="414" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Queued matches dropped on device</text>
<text x="885.0" y="440" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Quality requests use demotion signals</text>
<text x="600" y="566" font-size="19" font-weight="400" fill="#475569" text-anchor="middle">This post gives no figures for the new-topic period, the daily cap or accuracy.</text>
<text x="600" y="602" font-size="17" font-weight="400" fill="#64748b" text-anchor="middle">Source: Engineering at Meta, 10 November 2026</text>
</svg>