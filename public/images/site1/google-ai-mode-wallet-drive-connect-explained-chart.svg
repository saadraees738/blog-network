<text x="90" y="235" font-size="26" font-weight="700" fill="#fff">Gmail, Calendar, Photos</text><text x="500" y="235" font-size="24" fill="#e2e8f0">Already part of Personal Intelligence</text>
<rect x="60" y="282" width="1080" height="84" rx="12" fill="#1e293b"/><rect x="60" y="282" width="10" height="84" rx="4" fill="#60a5fa"/>
<text x="90" y="333" font-size="26" font-weight="700" fill="#fff">Google Wallet</text><text x="500" y="333" font-size="24" fill="#e2e8f0">Rolling out from 23 November 2026 (opt-in)</text>
