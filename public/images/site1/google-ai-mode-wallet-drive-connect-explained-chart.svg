<text x="60" y="112" font-size="22" fill="#94a3b8">As described in Google's post of 23 November 2026</text>
<text x="84" y="164" font-size="20" font-weight="700" fill="#94a3b8">APP</text><text x="500" y="164" font-size="20" font-weight="700" fill="#94a3b8">STATUS</text>
