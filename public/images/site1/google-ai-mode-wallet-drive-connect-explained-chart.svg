<text x="90" y="529" font-size="26" font-weight="700" fill="#fff">Gemini app context</text><text x="500" y="529" font-size="24" fill="#e2e8f0">Sharing due in coming weeks; opt-in "soon"</text>
<text x="60" y="605" font-size="20" fill="#94a3b8">Availability can differ by account and region. Google Help pages are not fully aligned.</text></svg>