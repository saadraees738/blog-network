<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, Arial, sans-serif">
<rect width="1200" height="630" fill="#f8fafc"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#0f172a">Three ways to send WhatsApp messages without doing it live</text>
<text x="40" y="92" font-size="19" fill="#475569">From WhatsApp pages and Digital Trends, checked 28 November 2026</text>
<rect x="40" y="120" width="1120" height="64" rx="8" fill="#14532d"/>
<text x="56" y="160" font-size="22" font-weight="700" fill="#fff"></text>
<text x="256" y="160" font-size="22" font-weight="700" fill="#fff">Scheduled message</text>
<text x="556" y="160" font-size="22" font-weight="700" fill="#fff">Away message</text>
<text x="856" y="160" font-size="22" font-weight="700" fill="#fff">Marketing message</text>
<rect x="40" y="184" width="1120" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="56" y="231" font-size="19" font-weight="700" fill="#0f172a">What starts it</text>
<text x="256" y="231" font-size="20" fill="#1e293b">A date and time you pick</text>
<text x="556" y="219" font-size="20" fill="#1e293b">A customer messages you</text>
<text x="556" y="246" font-size="20" fill="#1e293b">while it is switched on</text>
<text x="856" y="219" font-size="20" fill="#1e293b">You send it now or</text>
<text x="856" y="246" font-size="20" fill="#1e293b">pick a date and time</text>
<rect x="40" y="264" width="1120" height="80" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="56" y="311" font-size="19" font-weight="700" fill="#0f172a">Who gets it</text>
<text x="256" y="311" font-size="20" fill="#1e293b">A chat or group</text>
<text x="556" y="311" font-size="20" fill="#1e293b">Recipients you allow</text>
<text x="856" y="311" font-size="20" fill="#1e293b">Contacts you select</text>
<rect x="40" y="344" width="1120" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="56" y="391" font-size="19" font-weight="700" fill="#0f172a">Timing / limits</text>
<text x="256" y="379" font-size="20" fill="#1e293b">10 minutes to 14 days</text>
<text x="256" y="406" font-size="20" fill="#1e293b">ahead</text>
<text x="556" y="379" font-size="20" fill="#1e293b">Always, a custom period</text>
<text x="556" y="406" font-size="20" fill="#1e293b">or outside business hours</text>
<text x="856" y="379" font-size="20" fill="#1e293b">Up to 500 contacts each;</text>
<text x="856" y="406" font-size="20" fill="#1e293b">7,000 per 30 days</text>
<rect x="40" y="424" width="1120" height="80" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="56" y="471" font-size="19" font-weight="700" fill="#0f172a">Device online?</text>
<text x="256" y="459" font-size="20" fill="#1e293b">Sends even if the</text>
<text x="256" y="486" font-size="20" fill="#1e293b">phone is off</text>
<text x="556" y="459" font-size="20" fill="#1e293b">Internet connection</text>
<text x="556" y="486" font-size="20" fill="#1e293b">needed</text>
<text x="856" y="459" font-size="20" fill="#1e293b">Online at set time;</text>
<text x="856" y="486" font-size="20" fill="#1e293b">retries if not</text>
<rect x="40" y="504" width="1120" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="56" y="551" font-size="19" font-weight="700" fill="#0f172a">Watch out</text>
<text x="256" y="539" font-size="20" fill="#1e293b">Reported: not in the</text>
<text x="256" y="566" font-size="20" fill="#1e293b">Business app yet</text>
<text x="556" y="539" font-size="20" fill="#1e293b">Steps listed are for</text>
<text x="556" y="566" font-size="20" fill="#1e293b">Android</text>
<text x="856" y="539" font-size="20" fill="#1e293b">Paid; may not be in</text>
<text x="856" y="566" font-size="20" fill="#1e293b">your area</text>
<text x="40" y="612" font-size="16" fill="#64748b">Marketing limits also include 250 messages in the first 24 hours; limits may vary by user. Chart by Stackbrook.</text></svg>