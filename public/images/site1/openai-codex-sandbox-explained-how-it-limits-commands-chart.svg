<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter,DejaVu Sans,Arial,sans-serif"><rect width="1200" height="630" fill="#0f172a"/>
<text x="60" y="70" font-size="32" font-weight="700" fill="#f8fafc">How Codex enforces its sandbox on each operating system</text>
<text x="60" y="106" font-size="20" fill="#94a3b8">As described in OpenAI's "Inside the Codex sandbox" (18 Nov 2026)</text>
<g font-size="20" fill="#e2e8f0">
<rect x="60" y="140" width="1080" height="56" fill="#1e293b"/>
<text x="80" y="176" font-weight="700" fill="#facc15">System</text><text x="260" y="176" font-weight="700" fill="#facc15">Mechanism</text><text x="740" y="176" font-weight="700" fill="#facc15">Notable detail</text>
<rect x="60" y="206" width="1080" height="110" fill="#172033"/>
<text x="80" y="268" font-weight="700">macOS</text><text x="260" y="256">Seatbelt via sandbox-exec</text><text x="260" y="286" fill="#94a3b8">deny-by-default base policy</text><text x="740" y="256">man page marks it</text><text x="740" y="286" fill="#94a3b8">deprecated (per OpenAI)</text>
<rect x="60" y="326" width="1080" height="110" fill="#1e293b"/>
<text x="80" y="388" font-weight="700">Linux</text><text x="260" y="376">bubblewrap plus seccomp-bpf</text><text x="260" y="406" fill="#94a3b8">no_new_privs; network unshared</text><text x="740" y="376">Blocks connect and bind</text><text x="740" y="406" fill="#94a3b8">when networking is off</text>
<rect x="60" y="446" width="1080" height="110" fill="#172033"/>
<text x="80" y="508" font-weight="700">Windows</text><text x="260" y="496">Restricted tokens, sandbox users</text><text x="260" y="526" fill="#94a3b8">firewall rules; admin setup once</text><text x="740" y="496">Being replaced by an MXC-based</text><text x="740" y="526" fill="#94a3b8">sandbox (per November article)</text>
</g>
<text x="60" y="598" font-size="18" fill="#94a3b8">Chart created by Stackbrook from the cited pages.</text></svg>
