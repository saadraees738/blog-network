<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Three-column comparison of what three Google pages say about the Google Vids free AI video allowance: the 5 November announcement, the availability help page and the clip generation help page">
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#1d2a2a">Google Vids free AI video: three answers</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="20" fill="#4a5656">Check the help page for your own account type before you plan around a number.</text>
  <g>
    <rect x="60" y="150" width="340" height="40" fill="#2b6f8f"/>
    <rect x="430" y="150" width="340" height="40" fill="#c4572b"/>
    <rect x="800" y="150" width="340" height="40" fill="#6b5b95"/>
    <rect x="60" y="190" width="340" height="370" fill="#ffffff" stroke="#d9d6cc"/>
    <rect x="430" y="190" width="340" height="370" fill="#ffffff" stroke="#d9d6cc"/>
    <rect x="800" y="190" width="340" height="370" fill="#ffffff" stroke="#d9d6cc"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">
    <text x="78" y="177">Announcement, 5 Nov</text>
    <text x="448" y="177">Help: availability page</text>
    <text x="818" y="177">Help: AI clips page</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d2a2a">
    <text x="78" y="228">What it says</text>
    <text x="448" y="228">What it says</text>
    <text x="818" y="228">What it says</text>
    <text x="78" y="372">Unit used</text>
    <text x="448" y="372">Unit used</text>
    <text x="818" y="372">Unit used</text>
    <text x="78" y="472">Who it covers</text>
    <text x="448" y="472">Who it covers</text>
    <text x="818" y="472">Who it covers</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#1d2a2a">
    <text x="78" y="258">Up to three 15-second</text>
    <text x="78" y="284">videos a month, at no cost</text>
    <text x="448" y="258">Personal account: 60 seconds</text>
    <text x="448" y="284">of AI clips, 6 avatars a month</text>
    <text x="448" y="310">AI Pro: 500 seconds</text>
    <text x="448" y="336">Business Starter: 200 seconds</text>
    <text x="818" y="258">Most users: up to 50 videos</text>
    <text x="818" y="284">a month. Pick 3 to 15 seconds</text>
    <text x="818" y="310">per text-to-video clip</text>
    <text x="78" y="402">Number of videos</text>
    <text x="448" y="402">Seconds of video</text>
    <text x="818" y="402">Number of videos</text>
    <text x="78" y="502">Any Google or Workspace</text>
    <text x="78" y="528">account (per the post)</text>
    <text x="448" y="502">Varies by account type</text>
    <text x="448" y="528">in a table</text>
    <text x="818" y="502">Most users; needs an</text>
    <text x="818" y="528">eligible Workspace plan</text>
  </g>
  <text x="60" y="598" font-family="Arial, sans-serif" font-size="16" fill="#4a5656">Created by Stackbrook from the three Google pages, read 15 Nov 2026. The figures do not agree.</text>
</svg>
