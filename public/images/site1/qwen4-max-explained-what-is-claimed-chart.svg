<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Horizontal bar chart of three reductions Alibaba reports for Qwen4-Max: 25 percent fewer active parameters, 35 percent fewer tokens, about 60 percent lower cost per task">
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1d2a2a">What Alibaba says Qwen4-Max saves vs Qwen3.8-Max</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="20" fill="#4a5656">Percent reduction, all self-reported in Alibaba's 16 Nov 2026 announcement</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#1d2a2a">
    <text x="60" y="230">Active parameters per token</text>
    <rect x="60" y="246" width="383" height="56" rx="6" fill="#b3402a"/>
    <text x="463" y="284" font-weight="700">25%</text>
    <text x="60" y="380">Tokens used (High effort mode)</text>
    <rect x="60" y="396" width="537" height="56" rx="6" fill="#d9822b"/>
    <text x="617" y="434" font-weight="700">35%</text>
    <text x="60" y="530">Average cost per task (about)</text>
    <rect x="60" y="546" width="920" height="56" rx="6" fill="#8a2a1f"/>
    <text x="1000" y="584" font-weight="700">~60%</text>
  </g>
  
</svg>
