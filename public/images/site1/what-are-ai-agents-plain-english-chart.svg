<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Three-column comparison of a chatbot, a workflow automation and an AI agent: who decides the next step, an example, and the main risk">
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#1d2a2a">Chatbot vs workflow vs agent</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="20" fill="#4a5656">The difference is who decides the next step. Examples are illustrative.</text>
  <g>
    <rect x="60" y="150" width="340" height="40" fill="#2b6f8f"/>
    <rect x="430" y="150" width="340" height="40" fill="#c4572b"/>
    <rect x="800" y="150" width="340" height="40" fill="#6b5b95"/>
    <rect x="60" y="190" width="340" height="370" fill="#ffffff" stroke="#d9d6cc"/>
    <rect x="430" y="190" width="340" height="370" fill="#ffffff" stroke="#d9d6cc"/>
    <rect x="800" y="190" width="340" height="370" fill="#ffffff" stroke="#d9d6cc"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    <text x="78" y="178">Chatbot</text>
    <text x="448" y="178">Workflow automation</text>
    <text x="818" y="178">AI agent</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d2a2a">
    <text x="78" y="228">Who decides the next step</text>
    <text x="448" y="228">Who decides the next step</text>
    <text x="818" y="228">Who decides the next step</text>
    <text x="78" y="350">Example</text>
    <text x="448" y="350">Example</text>
    <text x="818" y="350">Example</text>
    <text x="78" y="462">Main risk</text>
    <text x="448" y="462">Main risk</text>
    <text x="818" y="462">Main risk</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#1d2a2a">
    <text x="78" y="258">You, one reply at a time</text>
    <text x="78" y="284">The chatbot only answers</text>
    <text x="78" y="380">Answers a returns-policy</text>
    <text x="78" y="406">question from your FAQ</text>
    <text x="78" y="492">A confident wrong answer</text>
    <text x="448" y="258">A path you set in advance</text>
    <text x="448" y="284">The model fills in steps</text>
    <text x="448" y="380">Each new enquiry is</text>
    <text x="448" y="406">tagged, logged in a</text>
    <text x="448" y="432">sheet, then acknowledged</text>
    <text x="448" y="492">Breaks on cases you</text>
    <text x="448" y="518">did not plan for</text>
    <text x="818" y="258">The model, within limits</text>
    <text x="818" y="284">you set</text>
    <text x="818" y="380">Researches a supplier</text>
    <text x="818" y="406">and drafts the email</text>
    <text x="818" y="432">for you to approve</text>
    <text x="818" y="492">Compounding errors, higher</text>
    <text x="818" y="518">cost, wrong actions</text>
  </g>
  <text x="60" y="598" font-family="Arial, sans-serif" font-size="16" fill="#4a5656">Agent and workflow definitions follow Anthropic, OpenAI and Google Cloud; the rest is illustrative.</text>
</svg>
