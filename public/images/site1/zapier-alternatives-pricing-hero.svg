<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
  <title id="t">Entry paid plan headline price, Zapier and four alternatives</title>
  <desc id="d">Dot plot on a price axis of headline monthly entry price: Make Core 9 dollars, Power Automate Premium 15 dollars per user, Zapier Professional 19.99 dollars, Activepieces Plus 20 dollars, n8n Cloud Starter 20 euros.</desc>
  <rect width="800" height="420" fill="#f8fafc"/>
  <text x="40" y="52" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Entry paid plan: headline monthly price</text>
  <text x="40" y="78" font-family="Arial, sans-serif" font-size="14" fill="#475569">Headline prices as read Nov 2026; billing period varies by vendor. What each price buys differs (see text).</text>
  <g font-family="Arial, sans-serif" fill="#0f172a" transform="translate(0,14)">
    <line x1="60" y1="300" x2="740" y2="300" stroke="#94a3b8" stroke-width="2"/>
    <line x1="60.0" y1="300" x2="60.0" y2="308" stroke="#94a3b8"/>
    <text x="60.0" y="328" font-size="14" text-anchor="middle" fill="#475569">$0</text>
    <line x1="196.0" y1="300" x2="196.0" y2="308" stroke="#94a3b8"/>
    <text x="196.0" y="328" font-size="14" text-anchor="middle" fill="#475569">$5</text>
    <line x1="332.0" y1="300" x2="332.0" y2="308" stroke="#94a3b8"/>
    <text x="332.0" y="328" font-size="14" text-anchor="middle" fill="#475569">$10</text>
    <line x1="468.0" y1="300" x2="468.0" y2="308" stroke="#94a3b8"/>
    <text x="468.0" y="328" font-size="14" text-anchor="middle" fill="#475569">$15</text>
    <line x1="604.0" y1="300" x2="604.0" y2="308" stroke="#94a3b8"/>
    <text x="604.0" y="328" font-size="14" text-anchor="middle" fill="#475569">$20</text>
    <line x1="740.0" y1="300" x2="740.0" y2="308" stroke="#94a3b8"/>
    <text x="740.0" y="328" font-size="14" text-anchor="middle" fill="#475569">$25</text>
    <line x1="604.0" y1="190" x2="604.0" y2="300" stroke="#cbd5e1" stroke-dasharray="4 4"/>
    <circle cx="304.8" cy="282" r="12" fill="#2563eb"/>
    <text x="304.8" y="240" font-size="16" text-anchor="middle">Make Core</text>
    <text x="304.8" y="260" font-size="16" font-weight="700" text-anchor="middle">$9</text>
    <circle cx="468.0" cy="282" r="12" fill="#2563eb"/>
    <text x="468.0" y="240" font-size="16" text-anchor="middle">Power Automate Premium</text>
    <text x="468.0" y="260" font-size="16" font-weight="700" text-anchor="middle">$15 per user</text>
    <circle cx="604.0" cy="282" r="12" fill="#2563eb"/>
    <text x="626.0" y="276" font-size="16">Zapier Professional</text>
    <text x="626.0" y="297" font-size="16" font-weight="700">$19.99</text>
    <circle cx="604.0" cy="236" r="12" fill="#2563eb"/>
    <text x="626.0" y="233" font-size="16">Activepieces Plus</text>
    <text x="626.0" y="251" font-size="16" font-weight="700">$20 (some pages $25)</text>
    <circle cx="604.0" cy="190" r="10" fill="#f8fafc" stroke="#0d9488" stroke-width="4"/>
    <text x="626.0" y="187" font-size="16">n8n Cloud Starter</text>
    <text x="626.0" y="205" font-size="16" font-weight="700">€20, not converted</text>
  </g>
  <text x="40" y="380" font-family="Arial, sans-serif" font-size="13" fill="#475569">Chart by Stackbrook. Dots at the same price are stacked upward; the ring marks a euro price placed at 20 on the dollar axis.</text>
  <text x="40" y="400" font-family="Arial, sans-serif" font-size="13" fill="#475569">Units differ: tasks, credits, executions, per-user licences.</text>
</svg>
