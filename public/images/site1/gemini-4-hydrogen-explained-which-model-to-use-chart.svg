<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Three-column comparison of Gemini 4 Hydrogen, Argon and Carbon: Google's framing, API price per million tokens, and when to reach for each">
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#1d2a2a">Hydrogen vs Argon vs Carbon</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="20" fill="#4a5656">Google's framing and prices as of 15 November 2026. The last row is Stackbrook's suggestion.</text>
  <g>
    <rect x="60" y="150" width="340" height="40" fill="#2b6f8f"/>
    <rect x="430" y="150" width="340" height="40" fill="#c4572b"/>
    <rect x="800" y="150" width="340" height="40" fill="#6b5b95"/>
    <rect x="60" y="190" width="340" height="370" fill="#ffffff" stroke="#d9d6cc"/>
    <rect x="430" y="190" width="340" height="370" fill="#ffffff" stroke="#d9d6cc"/>
    <rect x="800" y="190" width="340" height="370" fill="#ffffff" stroke="#d9d6cc"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    <text x="78" y="178">Gemini 4 Hydrogen</text>
    <text x="448" y="178">Gemini 4 Argon</text>
    <text x="818" y="178">Gemini 4 Carbon</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d2a2a">
    <text x="78" y="226">Google's framing</text>
    <text x="448" y="226">Google's framing</text>
    <text x="818" y="226">Google's framing</text>
    <text x="78" y="338">API price per 1M tokens</text>
    <text x="448" y="338">API price per 1M tokens</text>
    <text x="818" y="338">API price per 1M tokens</text>
    <text x="78" y="450">Reach for it when</text>
    <text x="448" y="450">Reach for it when</text>
    <text x="818" y="450">Reach for it when</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#1d2a2a">
    <text x="78" y="256">Fast, cost-efficient daily</text>
    <text x="78" y="282">driver for agentic work</text>
    <text x="78" y="368">$1.50 in, $7.50 out, flat</text>
    <text x="78" y="394">across the 1M-token window</text>
    <text x="78" y="480">Volume work, drafts, coding</text>
    <text x="78" y="506">and agents on a budget</text>
    <text x="448" y="256">Frontier model for deep,</text>
    <text x="448" y="282">long-horizon reasoning</text>
    <text x="448" y="368">$2 in, $10 out (introductory,</text>
    <text x="448" y="394">rises to $4 / $20 on 1 Dec)</text>
    <text x="448" y="480">Hard problems where a</text>
    <text x="448" y="506">wrong answer is costly</text>
    <text x="818" y="256">Strongest model, with cyber</text>
    <text x="818" y="282">and long-horizon strengths</text>
    <text x="818" y="368">Shares Argon's pricing:</text>
    <text x="818" y="394">$2 / $10, then $4 / $20</text>
    <text x="818" y="480">Limit-testing tasks; check</text>
    <text x="818" y="506">your access first</text>
  </g>
  <text x="60" y="598" font-family="Arial, sans-serif" font-size="16" fill="#4a5656">Sources: Google blog posts on Hydrogen and Carbon (28 Oct, 10 Nov). Prices in US dollars. Pricing can change.</text>
</svg>
