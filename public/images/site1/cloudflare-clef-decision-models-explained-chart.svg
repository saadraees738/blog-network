<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Bar chart of Cloudflare's listed input prices per million tokens for Clef-flash, Clef-omni and Clef">
<rect width="1200" height="630" fill="#f7f6f2"/>
<text x="60" y="66" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1d2a2a">Clef family: listed input price per million tokens</text>
<text x="60" y="100" font-family="Arial, sans-serif" font-size="19" fill="#4a5656">From Cloudflare blog posts of 1 and 9 Oct 2026. Clef-omni price is a launch price. Check docs for current prices.</text>
<g font-family="Arial, sans-serif" font-size="24" fill="#1d2a2a">
<text x="60" y="200" font-weight="700">Clef-flash</text><rect x="300" y="165" width="107" height="50" fill="#1f7a5a"/><text x="420" y="200">$0.038 (was $0.09)</text>
<text x="60" y="330" font-weight="700">Clef-omni</text><rect x="300" y="295" width="422" height="50" fill="#d9822b"/><text x="735" y="330">$0.15</text>
<text x="60" y="460" font-weight="700">Clef</text><rect x="300" y="425" width="675" height="50" fill="#1d2a2a"/><text x="990" y="460">$0.24</text>
</g>
<text x="60" y="580" font-family="Arial, sans-serif" font-size="18" fill="#4a5656">Bar length is proportional to price. Clef-flash hosted context is 24k tokens; Clef is 64k.</text>
</svg>
