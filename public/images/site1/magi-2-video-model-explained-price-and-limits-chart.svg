<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-label="MAGI-2 listed cost by clip length"><rect width="1200" height="630" fill="#ffffff"/><text x="60" y="68" font-size="36" font-weight="bold" fill="#0f172a">MAGI-2 listed cost by clip length</text><text x="60" y="108" font-size="22" fill="#475569">1080p, calculated at US$0.08 per second of video</text><rect x="130" y="477.3" width="160" height="42.7" rx="6" fill="#0f766e"/><text x="210" y="463.3" font-size="28" font-weight="bold" text-anchor="middle" fill="#0f172a">$0.32</text><text x="210" y="558" font-size="24" text-anchor="middle" fill="#334155">4 seconds</text><rect x="390" y="413.3" width="160" height="106.7" rx="6" fill="#0f766e"/><text x="470" y="399.3" font-size="28" font-weight="bold" text-anchor="middle" fill="#0f172a">$0.80</text><text x="470" y="558" font-size="24" text-anchor="middle" fill="#334155">10 seconds</text><rect x="650" y="306.7" width="160" height="213.3" rx="6" fill="#0f766e"/><text x="730" y="292.7" font-size="28" font-weight="bold" text-anchor="middle" fill="#0f172a">$1.60</text><text x="730" y="558" font-size="24" text-anchor="middle" fill="#334155">20 seconds</text><rect x="910" y="200.0" width="160" height="320.0" rx="6" fill="#0f766e"/><text x="990" y="186.0" font-size="28" font-weight="bold" text-anchor="middle" fill="#0f172a">$2.40</text><text x="990" y="558" font-size="24" text-anchor="middle" fill="#334155">30 seconds</text><line x1="80" y1="520" x2="1120" y2="520" stroke="#94a3b8" stroke-width="2"/><text x="60" y="605" font-size="18" fill="#64748b">Source: Sand AI Platform pricing page, read 27 November 2026. Failed-job billing not stated.</text></svg>