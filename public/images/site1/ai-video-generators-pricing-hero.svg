<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
  <title id="t">Approximate cost of one AI video generation</title>
  <desc id="d">Horizontal bar chart of approximate US dollars per generation if all monthly credits are used: Veo 3.1 Lite on Google AI Pro 0.20, Runway Gen-4.5 five second clip on Max 0.48, on Pro 0.75, on Standard 1.15. Clip lengths and resolutions differ.</desc>
  <rect width="800" height="420" fill="#f8fafc"/>
  <text x="40" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">What one AI video generation costs, roughly</text>
  <text x="40" y="76" font-family="Arial, sans-serif" font-size="14" fill="#475569">Plan price divided by credits, annual billing for Runway. Assumes you use every credit.</text>
  <text x="40" y="144" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Veo 3.1 Lite (Google AI Pro)</text>
  <rect x="310" y="120" width="44" height="36" rx="5" fill="#2563eb"/>
  <text x="364" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">$0.20</text>
  <text x="40" y="206" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Runway Gen-4.5, 5s (Max)</text>
  <rect x="310" y="182" width="106" height="36" rx="5" fill="#7c3aed"/>
  <text x="426" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">$0.48</text>
  <text x="40" y="268" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Runway Gen-4.5, 5s (Pro)</text>
  <rect x="310" y="244" width="165" height="36" rx="5" fill="#7c3aed"/>
  <text x="485" y="269" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">$0.75</text>
  <text x="40" y="330" font-family="Arial, sans-serif" font-size="15" fill="#0f172a">Runway Gen-4.5, 5s (Standard)</text>
  <rect x="310" y="306" width="253" height="36" rx="5" fill="#7c3aed"/>
  <text x="573" y="331" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">$1.15</text>
  <text x="40" y="404" font-family="Arial, sans-serif" font-size="13" fill="#475569">Chart by Stackbrook. Clip length and resolution differ by model; prices change, check the vendors.</text>
</svg>
