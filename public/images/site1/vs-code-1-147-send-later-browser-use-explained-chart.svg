<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Table comparing what Send Later and Browser Use in VS Code 1.147 need to run, as stated in the release notes">
<rect width="1200" height="630" fill="#f7f6f2"/>
<text x="60" y="64" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1d2a2a">VS Code 1.147: what each new agent feature needs</text>
<text x="60" y="98" font-family="Arial, sans-serif" font-size="19" fill="#4a5656">From the 1.147 release notes (18 Nov 2026) and VS Code docs; both features are not yet stable</text>
<rect x="60" y="130" width="1080" height="56" fill="#1d2a2a"/>
<text x="80" y="165" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f7f6f2">Item</text>
<text x="360" y="165" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f7f6f2">Send Later</text>
<text x="760" y="165" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f7f6f2">Browser Use</text>
<g font-family="Arial, sans-serif" font-size="20" fill="#1d2a2a">
<rect x="60" y="186" width="1080" height="72" fill="#ffffff"/>
<text x="80" y="228" font-weight="700">Status</text><text x="360" y="228">Experimental</text><text x="760" y="228">Preview</text>
<rect x="60" y="258" width="1080" height="72" fill="#eceae3"/>
<text x="80" y="300" font-weight="700">Setting</text><text x="360" y="300">sessions.sendLater.enabled</text><text x="760" y="300">chat.agentHost.browserUse.enabled</text>
<rect x="60" y="330" width="1080" height="72" fill="#ffffff"/>
<text x="80" y="372" font-weight="700">Where</text><text x="360" y="372">Agents window only</text><text x="760" y="372">Local Copilot session</text>
<rect x="60" y="402" width="1080" height="72" fill="#eceae3"/>
<text x="80" y="444" font-weight="700">Needs</text><text x="360" y="444">Automations on (default)</text><text x="760" y="444">Browser extension, Node.js 22+</text>
<rect x="60" y="474" width="1080" height="72" fill="#ffffff"/>
<text x="80" y="516" font-weight="700">Main limit</text><text x="360" y="516">Computer must be awake</text><text x="760" y="516">You handle sign-in steps</text>
</g>
<text x="60" y="590" font-family="Arial, sans-serif" font-size="18" fill="#4a5656">Table created by Stackbrook from the cited pages. Chrome or Edge is the browser Browser Use controls.</text>
</svg>
