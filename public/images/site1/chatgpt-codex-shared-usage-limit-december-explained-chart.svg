<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, DejaVu Sans, sans-serif"><rect width="1200" height="630" fill="#0e1422"/><text x="60" y="62" fill="#fff" font-size="32" font-weight="700">Estimated local messages per five-hour window</text><text x="60" y="100" fill="#aab4c8" font-size="20">Plus and Standard Business, Work and Codex, as listed on 26 Nov 2026 (logarithmic scale)</text><line x1="270" y1="130" x2="270" y2="500" stroke="#26314a"/><text x="270" y="528" fill="#aab4c8" font-size="18" text-anchor="middle">3</text><line x1="400" y1="130" x2="400" y2="500" stroke="#26314a"/><text x="400" y="528" fill="#aab4c8" font-size="18" text-anchor="middle">10</text><line x1="518" y1="130" x2="518" y2="500" stroke="#26314a"/><text x="518" y="528" fill="#aab4c8" font-size="18" text-anchor="middle">30</text><line x1="648" y1="130" x2="648" y2="500" stroke="#26314a"/><text x="648" y="528" fill="#aab4c8" font-size="18" text-anchor="middle">100</text><line x1="767" y1="130" x2="767" y2="500" stroke="#26314a"/><text x="767" y="528" fill="#aab4c8" font-size="18" text-anchor="middle">300</text><line x1="897" y1="130" x2="897" y2="500" stroke="#26314a"/><text x="897" y="528" fill="#aab4c8" font-size="18" text-anchor="middle">1,000</text><line x1="1015" y1="130" x2="1015" y2="500" stroke="#26314a"/><text x="1015" y="528" fill="#aab4c8" font-size="18" text-anchor="middle">3,000</text><text x="60" y="173" fill="#fff" font-size="23">GPT-6.2 Astra</text><line x1="345" y1="165" x2="574" y2="165" stroke="#fb9278" stroke-width="12" stroke-linecap="round"/><circle cx="345" cy="165" r="11" fill="#fff"/><circle cx="574" cy="165" r="11" fill="#fff"/><text x="459" y="149" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">6 to 50</text><text x="60" y="237" fill="#fff" font-size="23">GPT-6.2 Sol</text><line x1="457" y1="229" x2="712" y2="229" stroke="#fb9278" stroke-width="12" stroke-linecap="round"/><circle cx="457" cy="229" r="11" fill="#fff"/><circle cx="712" cy="229" r="11" fill="#fff"/><text x="584" y="213" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">17 to 180</text><text x="60" y="301" fill="#fff" font-size="23">GPT-6 Astra</text><line x1="325" y1="293" x2="562" y2="293" stroke="#fb9278" stroke-width="12" stroke-linecap="round"/><circle cx="325" cy="293" r="11" fill="#fff"/><circle cx="562" cy="293" r="11" fill="#fff"/><text x="444" y="277" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">5 to 45</text><text x="60" y="365" fill="#fff" font-size="23">GPT-6.1 Sol</text><line x1="444" y1="357" x2="699" y2="357" stroke="#fb9278" stroke-width="12" stroke-linecap="round"/><circle cx="444" cy="357" r="11" fill="#fff"/><circle cx="699" cy="357" r="11" fill="#fff"/><text x="571" y="341" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">15 to 160</text><text x="60" y="429" fill="#fff" font-size="23">GPT-6 Sol</text><line x1="444" y1="421" x2="692" y2="421" stroke="#fb9278" stroke-width="12" stroke-linecap="round"/><circle cx="444" cy="421" r="11" fill="#fff"/><circle cx="692" cy="421" r="11" fill="#fff"/><text x="568" y="405" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">15 to 150</text><text x="60" y="493" fill="#fff" font-size="23">GPT-6 Luna</text><line x1="783" y1="485" x2="1015" y2="485" stroke="#fb9278" stroke-width="12" stroke-linecap="round"/><circle cx="783" cy="485" r="11" fill="#fff"/><circle cx="1015" cy="485" r="11" fill="#fff"/><text x="899" y="469" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">350 to 3,000</text><text x="60" y="578" fill="#aab4c8" font-size="18">OpenAI estimates; cloud tasks may use more and weekly limits may apply. Not December figures.</text><text x="60" y="606" fill="#aab4c8" font-size="18">Sources: OpenAI pricing and Help Center pages. The Business page lists 15 to 150 for GPT-6.1 Sol.</text></svg>