<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Status table comparing Samsung Intelligent Eyewear and Ray-Ban Meta on display, camera, assistant, status and price, with each claim marked confirmed or reported">
