<text x="760" y="339" font-size="22" font-weight="600" text-anchor="middle" fill="#64748b">Not listed</text>
<text x="1010" y="339" font-size="22" font-weight="600" text-anchor="middle" fill="#1d4ed8">10 days</text>
<rect x="40" y="358" width="1120" height="54" fill="#f1f5f9"/>
<text x="62" y="393" font-size="22" fill="#0f172a">Familiar face alerts (not everywhere)</text>
<text x="760" y="393" font-size="22" font-weight="600" text-anchor="middle" fill="#1d4ed8">Yes</text>
<text x="1010" y="393" font-size="22" font-weight="600" text-anchor="middle" fill="#1d4ed8">Yes</text>
<rect x="40" y="412" width="1120" height="54" fill="#ffffff"/>
