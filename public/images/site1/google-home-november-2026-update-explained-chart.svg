<text x="1010" y="555" font-size="22" font-weight="600" text-anchor="middle" fill="#1d4ed8">Yes</text>
<text x="40" y="604" font-size="17" fill="#475569">Google Store (US) and Google Home Help, read 27 November 2026. "Not listed" = not shown for that plan on those pages.</text></svg>