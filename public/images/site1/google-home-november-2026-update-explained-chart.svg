<text x="760" y="447" font-size="22" font-weight="600" text-anchor="middle" fill="#1d4ed8">Yes</text>
<text x="1010" y="447" font-size="22" font-weight="600" text-anchor="middle" fill="#1d4ed8">Yes</text>
<rect x="40" y="466" width="1120" height="54" fill="#f1f5f9"/>
<text x="62" y="501" font-size="22" fill="#0f172a">Descriptive notifications</text>
