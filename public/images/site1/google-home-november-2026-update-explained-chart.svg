<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, Arial, sans-serif">
<rect width="1200" height="630" fill="#ffffff"/>
<text x="40" y="58" font-size="32" font-weight="700" fill="#0f172a">Google Home Premium: Standard and Advanced</text>
<rect x="40" y="86" width="1120" height="56" rx="8" fill="#0f172a"/>
<text x="62" y="122" font-size="22" font-weight="700" fill="#fff">What you get</text><text x="760" y="122" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Standard</text><text x="1010" y="122" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Advanced</text>
