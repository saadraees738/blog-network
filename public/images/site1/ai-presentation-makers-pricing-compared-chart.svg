<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Bar chart of annual-billing prices per month for Canva Pro, Beautiful.ai Pro and Team, and Gamma Business">
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#1d2a2a">Published paid plans, annual billing</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="20" fill="#4a5656">US dollars per month, list prices as of 12 Nov 2026. Gamma Plus and Pro prices were not published on pages we could read.</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#1d2a2a">
    <text x="60" y="215">Canva Pro</text>
    <text x="60" y="285">Beautiful.ai Pro</text>
    <text x="60" y="355">Beautiful.ai Pro</text>
    <text x="60" y="425">Beautiful.ai Team</text>
    <text x="60" y="495">Gamma Business</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#4a5656">
    <text x="60" y="236">$119.99 a year, up to 5 people</text>
    <text x="60" y="306">pricing-plans page</text>
    <text x="60" y="376">pricing page</text>
    <text x="60" y="446">per user, 2 to 20 seats</text>
    <text x="60" y="516">per member</text>
  </g>
  <g>
    <rect x="300" y="192" width="180" height="32" fill="#2b6f8f"/>
    <rect x="300" y="262" width="216" height="32" fill="#c4572b"/>
    <rect x="300" y="332" width="261" height="32" fill="#c4572b"/>
    <rect x="300" y="402" width="720" height="32" fill="#c4572b"/>
    <rect x="300" y="472" width="720" height="32" fill="#6b5b95"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">
    <text x="312" y="215">$10.00</text>
    <text x="312" y="285">$12</text>
    <text x="312" y="355">$14.50</text>
    <text x="312" y="425">$40</text>
    <text x="312" y="495">$40</text>
  </g>
  <text x="60" y="600" font-family="Arial, sans-serif" font-size="16" fill="#4a5656">Sources: Canva Pro page, Beautiful.ai pricing pages, Gamma business help article. Bars to scale.</text>
</svg>
