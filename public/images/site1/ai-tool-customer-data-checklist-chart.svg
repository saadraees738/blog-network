<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Six-question checklist to check on an AI vendor's pages before giving it customer data">
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#1d2a2a">Six questions to answer before you paste</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="20" fill="#4a5656">Check each one for your exact plan, on the vendor's live pages, as of 12 Nov 2026.</text>
  <g font-family="Arial, sans-serif">
    <g>
      <rect x="60" y="160" width="520" height="130" rx="10" fill="#2b6f8f"/>
      <text x="90" y="205" font-size="30" font-weight="700" fill="#ffffff">1  Training</text>
      <text x="90" y="245" font-size="20" fill="#ffffff">Is my data used to train models</text>
      <text x="90" y="272" font-size="20" fill="#ffffff">by default on this plan?</text>
    </g>
    <g>
      <rect x="620" y="160" width="520" height="130" rx="10" fill="#c4572b"/>
      <text x="650" y="205" font-size="30" font-weight="700" fill="#ffffff">2  Retention</text>
      <text x="650" y="245" font-size="20" fill="#ffffff">How long is it kept,</text>
      <text x="650" y="272" font-size="20" fill="#ffffff">including backups?</text>
    </g>
    <g>
      <rect x="60" y="320" width="520" height="130" rx="10" fill="#6b5b95"/>
      <text x="90" y="365" font-size="30" font-weight="700" fill="#ffffff">3  Location</text>
      <text x="90" y="405" font-size="20" fill="#ffffff">Where is it stored and processed,</text>
      <text x="90" y="432" font-size="20" fill="#ffffff">and by which sub-processors?</text>
    </g>
    <g>
      <rect x="620" y="320" width="520" height="130" rx="10" fill="#2b6f8f"/>
      <text x="650" y="365" font-size="30" font-weight="700" fill="#ffffff">4  Contract</text>
      <text x="650" y="405" font-size="20" fill="#ffffff">Is there a Data Processing</text>
      <text x="650" y="432" font-size="20" fill="#ffffff">Agreement I can sign or accept?</text>
    </g>
    <g>
      <rect x="60" y="480" width="520" height="110" rx="10" fill="#c4572b"/>
      <text x="90" y="523" font-size="30" font-weight="700" fill="#ffffff">5  Plan type</text>
      <text x="90" y="560" font-size="20" fill="#ffffff">Does the consumer plan differ from business or API?</text>
    </g>
    <g>
      <rect x="620" y="480" width="520" height="110" rx="10" fill="#6b5b95"/>
      <text x="650" y="523" font-size="30" font-weight="700" fill="#ffffff">6  Exit</text>
      <text x="650" y="560" font-size="20" fill="#ffffff">Can I delete my data, and what survives?</text>
    </g>
  </g>
</svg>
