<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Column chart of estimated yearly electricity use of 403 US hyperscale data centers: 68 terawatt-hours in the low scenario and 99 terawatt-hours in the high scenario">
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1d2a2a">403 US hyperscale data centers: estimated yearly electricity</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="20" fill="#4a5656">Terawatt-hours (TWh), May 2024 to April 2025, range across the study's operating scenarios</text>
  <line x1="120" y1="540" x2="1100" y2="540" stroke="#1d2a2a" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#1d2a2a">
    <rect x="260" y="311" width="220" height="229" rx="6" fill="#1f7a7a"/>
    <text x="370" y="292" font-size="40" font-weight="700" text-anchor="middle">68 TWh</text>
    <text x="370" y="578" font-size="22" text-anchor="middle">Low scenario</text>
    <rect x="720" y="206" width="220" height="334" rx="6" fill="#d9822b"/>
    <text x="830" y="188" font-size="40" font-weight="700" text-anchor="middle" fill="#1d2a2a">99 TWh</text>
    <text x="830" y="578" font-size="22" text-anchor="middle">High scenario</text>
    <text x="1100" y="610" font-size="16" text-anchor="end" fill="#4a5656">Source: Guidi et al., arXiv 2606.05420 and EurekAlert release</text>
  </g>
</svg>
