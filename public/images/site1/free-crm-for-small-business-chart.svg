<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d">
  <title id="t">Free-plan user limits for four CRMs</title>
  <desc id="d">Pictogram, one person icon per allowed user: HubSpot 2 users, Zoho CRM 3 users, Freshsales 3 users. Bitrix24 states no user cap, shown as fading icons.</desc>
  <defs>
    <symbol id="p" viewBox="0 0 28 34"><circle cx="14" cy="9" r="8"/><path d="M0 34a14 14 0 0 1 28 0z"/></symbol>
  </defs>
  <rect width="800" height="420" fill="#f8fafc"/>
  <text x="40" y="52" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Users allowed on each free CRM plan</text>
  <text x="40" y="78" font-family="Arial, sans-serif" font-size="14" fill="#475569">One icon = one user seat on the free plan. Vendor pages, Nov 2026.</text>
  <g font-family="Arial, sans-serif" font-size="17" fill="#0f172a">
    <line x1="40" y1="100" x2="760" y2="100" stroke="#e2e8f0"/>
    <text x="40" y="140">HubSpot</text>
    <g fill="#2563eb"><use href="#p" x="200" y="110" width="38" height="46" opacity="1"/><use href="#p" x="254" y="110" width="38" height="46" opacity="1"/></g>
    <text x="322" y="140" font-weight="700">2 users</text>
    <line x1="40" y1="168" x2="760" y2="168" stroke="#e2e8f0"/>
    <text x="40" y="208">Zoho CRM</text>
    <g fill="#2563eb"><use href="#p" x="200" y="178" width="38" height="46" opacity="1"/><use href="#p" x="254" y="178" width="38" height="46" opacity="1"/><use href="#p" x="308" y="178" width="38" height="46" opacity="1"/></g>
    <text x="376" y="208" font-weight="700">3 users</text>
    <line x1="40" y1="236" x2="760" y2="236" stroke="#e2e8f0"/>
    <text x="40" y="276">Freshsales</text>
    <g fill="#2563eb"><use href="#p" x="200" y="246" width="38" height="46" opacity="1"/><use href="#p" x="254" y="246" width="38" height="46" opacity="1"/><use href="#p" x="308" y="246" width="38" height="46" opacity="1"/></g>
    <text x="376" y="276" font-weight="700">3 users</text>
    <line x1="40" y1="304" x2="760" y2="304" stroke="#e2e8f0"/>
    <text x="40" y="344">Bitrix24</text>
    <g fill="#0d9488"><use href="#p" x="200" y="314" width="38" height="46" opacity="0.95"/><use href="#p" x="254" y="314" width="38" height="46" opacity="0.6"/><use href="#p" x="308" y="314" width="38" height="46" opacity="0.35"/><use href="#p" x="362" y="314" width="38" height="46" opacity="0.15"/></g>
    <text x="430" y="344" font-weight="700">No user cap stated (5 GB storage)</text>
    <line x1="40" y1="372" x2="760" y2="372" stroke="#e2e8f0"/>
  </g>
  <text x="40" y="398" font-family="Arial, sans-serif" font-size="13" fill="#475569">Chart by Stackbrook. Bitrix24 icons fade to show "no stated limit", not a count.</text>
</svg>
