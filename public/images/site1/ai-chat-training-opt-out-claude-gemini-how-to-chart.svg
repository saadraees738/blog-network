<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Horizontal bar chart of retention periods in months: Claude incognito 30 days, Claude deleted chats purged within 30 days, Gemini with history off around 2 months, Gemini auto-delete default 18 months, Claude flagged content up to 2 years, Claude training data up to 5 years">
<rect width="1200" height="630" fill="#f7f6f2"/>
<text x="60" y="70" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1d2a2a">How long chats can stay stored</text>
<text x="60" y="106" font-family="Arial, sans-serif" font-size="20" fill="#4a5656">Periods stated on the vendors' help pages (bar length in months, 30 days = 1 month)</text>
<text x="455" y="180" font-family="Arial, sans-serif" font-size="20" fill="#1d2a2a" text-anchor="end">Claude incognito chat kept</text>
<rect x="470" y="150" width="8" height="46" rx="6" fill="#1f7a7a"/>
<text x="490" y="181" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2a2a">30 days</text>
<text x="455" y="244" font-family="Arial, sans-serif" font-size="20" fill="#1d2a2a" text-anchor="end">Claude deleted chat purged from back end</text>
<rect x="470" y="214" width="8" height="46" rx="6" fill="#1f7a7a"/>
<text x="490" y="245" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2a2a">within 30 days</text>
<text x="455" y="308" font-family="Arial, sans-serif" font-size="20" fill="#1d2a2a" text-anchor="end">Gemini history off: still saved</text>
<rect x="470" y="278" width="15" height="46" rx="6" fill="#1f7a7a"/>
<text x="497" y="309" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2a2a">around 2 months</text>
<text x="455" y="372" font-family="Arial, sans-serif" font-size="20" fill="#1d2a2a" text-anchor="end">Gemini auto-delete default</text>
<rect x="470" y="342" width="132" height="46" rx="6" fill="#d9822b"/>
<text x="614" y="373" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2a2a">18 months</text>
<text x="455" y="436" font-family="Arial, sans-serif" font-size="20" fill="#1d2a2a" text-anchor="end">Claude flagged inputs and outputs</text>
<rect x="470" y="406" width="176" height="46" rx="6" fill="#d9822b"/>
<text x="658" y="437" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2a2a">up to 2 years</text>
<text x="455" y="500" font-family="Arial, sans-serif" font-size="20" fill="#1d2a2a" text-anchor="end">Claude chats kept for training (setting on)</text>
<rect x="470" y="470" width="440" height="46" rx="6" fill="#d9822b"/>
<text x="922" y="501" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2a2a">up to 5 years</text>
<text x="60" y="590" font-family="Arial, sans-serif" font-size="16" fill="#4a5656">Sources: Anthropic privacy centre (1 Jul 2026) and Claude help centre; Google Gemini Apps help page. Checked 19 Nov 2026.</text></svg>