<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Table of the field types Clairic can return and what each one gives back">
<rect width="1200" height="630" fill="#f7f6f2"/>
<text x="60" y="66" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#1d2a2a">Clairic: the field types you can ask for</text>
<text x="60" y="100" font-family="Arial, sans-serif" font-size="19" fill="#4a5656">From Cloudflare changelog, 19 Oct 2026. Preview model; every answer is well formed, not necessarily correct</text>
<rect x="60" y="130" width="1080" height="46" fill="#1d2a2a"/><text x="80" y="160" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f7f6f2">Field type</text><text x="400" y="160" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f7f6f2">What comes back</text>
<rect x="60" y="176" width="1080" height="60" fill="#ffffff"/><rect x="60" y="176" width="8" height="60" fill="#1f7a5a"/><text x="86" y="214" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2a2a">text</text><text x="400" y="214" font-family="Arial, sans-serif" font-size="21" fill="#1d2a2a">Exact span from the input, with character offsets</text>
<rect x="60" y="236" width="1080" height="60" fill="#ece9e0"/><rect x="60" y="236" width="8" height="60" fill="#1f7a5a"/><text x="86" y="274" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2a2a">number</text><text x="400" y="274" font-family="Arial, sans-serif" font-size="21" fill="#1d2a2a">Honours integer or decimal places</text>
<rect x="60" y="296" width="1080" height="60" fill="#ffffff"/><rect x="60" y="296" width="8" height="60" fill="#1f7a5a"/><text x="86" y="334" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2a2a">date / time / datetime</text><text x="400" y="334" font-family="Arial, sans-serif" font-size="21" fill="#1d2a2a">ISO form; set reference_date for relative dates</text>
<rect x="60" y="356" width="1080" height="60" fill="#ece9e0"/><rect x="60" y="356" width="8" height="60" fill="#1f7a5a"/><text x="86" y="394" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2a2a">duration</text><text x="400" y="394" font-family="Arial, sans-serif" font-size="21" fill="#1d2a2a">Returned in the unit you choose</text>
<rect x="60" y="416" width="1080" height="60" fill="#ffffff"/><rect x="60" y="416" width="8" height="60" fill="#1f7a5a"/><text x="86" y="454" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2a2a">list</text><text x="400" y="454" font-family="Arial, sans-serif" font-size="21" fill="#1d2a2a">Every matching text, number or date, in input order</text>
<rect x="60" y="476" width="1080" height="60" fill="#ece9e0"/><rect x="60" y="476" width="8" height="60" fill="#d9822b"/><text x="86" y="514" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2a2a">estimate</text><text x="400" y="514" font-family="Arial, sans-serif" font-size="21" fill="#1d2a2a">Median plus 80% interval (p10 to p90), min and max bounds</text>
<rect x="60" y="536" width="1080" height="60" fill="#ffffff"/><rect x="60" y="536" width="8" height="60" fill="#d9822b"/><text x="86" y="574" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2a2a">forecast</text><text x="400" y="574" font-family="Arial, sans-serif" font-size="21" fill="#1d2a2a">One estimate per future step, up to 64 steps</text>
<text x="60" y="622" font-family="Arial, sans-serif" font-size="18" fill="#4a5656">Green = read or computed from the input; orange = statistical estimates. $0.10 per million input tokens.</text></svg>