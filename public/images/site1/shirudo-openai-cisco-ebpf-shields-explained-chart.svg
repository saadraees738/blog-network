<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Table showing which of three vendor pages state each Shirudo detail">
<rect width="1200" height="630" fill="#f7f6f2"/>
<text x="60" y="62" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1d2a2a">What each Shirudo page actually states</text>
<text x="60" y="96" font-family="Arial, sans-serif" font-size="20" fill="#4a5656">Sources: OpenAI post, Cisco newsroom release, Cisco blog (all 23 Nov 2026). Yes = stated on that page for Shirudo.</text>
<g font-family="Arial, sans-serif" font-size="22" fill="#1d2a2a">
<rect x="60" y="130" width="1080" height="56" fill="#1f7a5a"/>
<g fill="#ffffff" font-weight="700"><text x="80" y="166">Detail</text><text x="650" y="166" text-anchor="middle">OpenAI post</text><text x="830" y="166" text-anchor="middle">Cisco release</text><text x="1020" y="166" text-anchor="middle">Cisco blog</text></g>
<g>
<rect x="60" y="186" width="1080" height="56" fill="#ffffff"/><text x="80" y="222">Built on eBPF</text><text x="650" y="222" text-anchor="middle">Yes</text><text x="830" y="222" text-anchor="middle">Yes</text><text x="1020" y="222" text-anchor="middle">Yes</text>
<rect x="60" y="242" width="1080" height="56" fill="#eceae3"/><text x="80" y="278">Open-source license named (BSD 2-Clause)</text><text x="650" y="278" text-anchor="middle">Yes</text><text x="830" y="278" text-anchor="middle">No</text><text x="1020" y="278" text-anchor="middle">No</text>
<rect x="60" y="298" width="1080" height="56" fill="#ffffff"/><text x="80" y="334">Shields are signed before loading</text><text x="650" y="334" text-anchor="middle">Yes</text><text x="830" y="334" text-anchor="middle">Yes</text><text x="1020" y="334" text-anchor="middle">Principle only</text>
<rect x="60" y="354" width="1080" height="56" fill="#eceae3"/><text x="80" y="390">Elasticsearch demo with no restart</text><text x="650" y="390" text-anchor="middle">Yes</text><text x="830" y="390" text-anchor="middle">No</text><text x="1020" y="390" text-anchor="middle">No</text>
<rect x="60" y="410" width="1080" height="40" fill="#ffffff"/><text x="80" y="438" font-size="20">Blocked Java4Shell attempts</text><text x="650" y="438" text-anchor="middle" font-size="20">Yes</text><text x="830" y="438" text-anchor="middle" font-size="20">Yes</text><text x="1020" y="438" text-anchor="middle" font-size="20">Yes</text>
<rect x="60" y="450" width="1080" height="40" fill="#eceae3"/><text x="80" y="478" font-size="20">Blocked PHP flaw attempts</text><text x="650" y="478" text-anchor="middle" font-size="20">No</text><text x="830" y="478" text-anchor="middle" font-size="20">Yes</text><text x="1020" y="478" text-anchor="middle" font-size="20">Yes</text>
<rect x="60" y="490" width="1080" height="40" fill="#ffffff"/><text x="80" y="518" font-size="20">Supported kernels or performance limits</text><text x="650" y="518" text-anchor="middle" font-size="20">No</text><text x="830" y="518" text-anchor="middle" font-size="20">No</text><text x="1020" y="518" text-anchor="middle" font-size="20">No</text>
</g></g>
<text x="60" y="580" font-family="Arial, sans-serif" font-size="20" fill="#4a5656">All three pages describe vendor claims. No independent test is cited.</text>
</svg>
